<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta http-equiv="content-language" content="en">
    <meta http-equiv="content-script-type" content="text/javascript">
    <meta http-equiv="content-style-type" content="text/css">
    <meta name="description" content="This is the online markdown editor with live preview.">

    <script>
      (function(){
        try {
          var BOOT_THEME_KEY = 'mlp.theme';
          var raw = localStorage.getItem(BOOT_THEME_KEY);
          var useDark = raw === 'dark';
          document.documentElement.setAttribute('data-theme', useDark ? 'dark' : 'light');

          var PREVIEW_CSS_LIGHT = 'css/github-markdown-light.css?v=1.11.0';
          var PREVIEW_CSS_DARK = 'css/github-markdown-dark_dimmed.css?v=1.11.0';
          var href = useDark ? PREVIEW_CSS_DARK : PREVIEW_CSS_LIGHT;

          var link = document.createElement('link');
          link.id = 'gh-markdown-link';
          link.rel = 'stylesheet';
          link.type = 'text/css';
          link.href = href;
          document.head.appendChild(link);

          var HLJS_CSS_LIGHT = 'css/hljs-github-light.css?v=1.11.0';
          var HLJS_CSS_DARK = 'css/hljs-github-dark.css?v=1.11.0';
          var hljsLink = document.createElement('link');
          hljsLink.id = 'hljs-theme-link';
          hljsLink.rel = 'stylesheet';
          hljsLink.type = 'text/css';
          hljsLink.href = useDark ? HLJS_CSS_DARK : HLJS_CSS_LIGHT;
          document.head.appendChild(hljsLink);
        } catch (e) {
          // ignore — app will correct theme after load
        }
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="css/style.css?v=1.11.0">
    <link rel="icon" type="image/png" href="favicon.png">

    <script type="module" src="/src/main.js?v=1.11.0"></script>
    <title>Markdown Live Preview</title>
  </head>
  <body>

    <header>
        <div id="menu-items">
            <div id="refresh-button" title="Reload the current file from disk"><a href="#"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Refresh</a></div>
            <div id="save-button" title="Save the current tab to disk"><a href="#"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>Save</a></div>
            <div id="clipboard-button" title="Open clipboard text in a new tab"><a href="#"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>Clipboard</a></div>
            <div id="file-path-input-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
                <input type="text" id="file-path-input" placeholder="File path" title="Type a file path and press Enter to open it" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
            </div>
            <div id="settings-button" title="Settings"><a href="#"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings</a></div>
        </div>
    </header>

    <div id="tab-bar"></div>

    <div id="container" class="split-container">

        <div id="edit" class="column editor-pane">
            <div id="editor-wrapper">
                <div id="editor"></div>
            </div>
        </div>

        <div id="split-divider" class="split-divider"></div>

        <div id="preview" class="column preview-pane">
            <div id="preview-wrapper">
                <div id="output" class="content markdown-body"></div>
            </div>
        </div>
    </div>

    <footer></footer>

    <dialog id="settings-dialog" class="custom-dialog settings-dialog">
        <div class="dialog-container settings-dialog-container">
            <div class="settings-dialog-header">
                <h3 class="settings-dialog-title">Settings</h3>
            </div>
            <div class="settings-dialog-body">
                <div class="settings-option">
                    <label class="settings-option-label" for="theme-checkbox">
                        <input type="checkbox" id="theme-checkbox">
                        <span class="settings-option-title">Dark mode</span>
                    </label>
                    <span class="settings-option-desc">Use dark colour scheme</span>
                </div>
                <div class="settings-option">
                    <label class="settings-option-label" for="full-width-checkbox">
                        <input type="checkbox" id="full-width-checkbox">
                        <span class="settings-option-title">Full width</span>
                    </label>
                    <span class="settings-option-desc">Expand preview to full width in collapsed mode</span>
                </div>
                <div class="settings-option">
                    <label class="settings-option-label" for="preview-max-width-input">
                        <span class="settings-option-title">Preview max width</span>
                    </label>
                    <div class="settings-input-row">
                        <input type="number" id="preview-max-width-input" class="dialog-input settings-number-input" min="40" max="250" step="1" value="85" autocomplete="off">
                        <span class="settings-unit">ch</span>
                    </div>
                    <span class="settings-option-desc">Maximum width of preview content in collapsed mode</span>
                </div>
                <div class="settings-option">
                    <label class="settings-option-label" for="quote-mode-checkbox">
                        <input type="checkbox" id="quote-mode-checkbox">
                        <span class="settings-option-title">Quotation mode</span>
                    </label>
                    <span class="settings-option-desc">Select text in the preview to save it as a quotation with a note</span>
                </div>
            </div>
        </div>
    </dialog>

    <button id="quote-selection-button" class="quote-fab" type="button" title="Save as quotation" hidden>
        <svg class="quote-icon" viewBox="0 0 16.3 13" fill="currentColor" aria-hidden="true">
            <path d="M0 0H7V13H3.85C3.85 9.77 2.13 7.15 0 7.15ZM9.3 0H16.3V13H13.15C13.15 9.77 11.43 7.15 9.3 7.15Z"/>
        </svg>
    </button>

    <button id="quotes-open-button" class="quote-fab" type="button" title="Quotations" hidden>
        <svg class="quote-icon" viewBox="0 0 16.3 13" fill="currentColor" aria-hidden="true">
            <path d="M0 0H7V13H3.85C3.85 9.77 2.13 7.15 0 7.15ZM9.3 0H16.3V13H13.15C13.15 9.77 11.43 7.15 9.3 7.15Z"/>
        </svg>
        <span class="quotes-badge">0</span>
    </button>

    <dialog id="quotes-dialog" class="custom-dialog quotes-dialog">
        <div class="dialog-container quotes-dialog-container">
            <div class="quotes-dialog-header">
                <h3 class="quotes-dialog-title">Quotations</h3>
                <span id="quotes-dialog-count" class="quotes-dialog-count">0</span>
            </div>
            <div id="quotes-dialog-body" class="quotes-dialog-body"></div>
            <div class="quotes-dialog-footer">
                <button id="quotes-copy-button" class="dialog-button dialog-button-default" type="button">Copy all</button>
            </div>
        </div>
    </dialog>
  </body>
</html>
